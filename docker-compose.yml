version: "3.9"

services:
  # ─── Frontend (Vite build → Nginx) ───
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - mantra-net

  # ─── Evolution API (WhatsApp engine) ───
  evolution-api:
    image: atendai/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-changeme}
    volumes:
      - evolution_data:/evolution/instances
    restart: unless-stopped
    networks:
      - mantra-net

  # ─── AstrBot (AI Assistant, uncomment jika siap) ───
  # astrbot:
  #   image: soulter/astrbot:latest
  #   ports:
  #     - "6185:6185"
  #   volumes:
  #     - astrbot_data:/AstrBot/data
  #   restart: unless-stopped
  #   networks:
  #     - mantra-net

  # ─── Plan B: WWeb.js (opsional, uncomment jika siap) ───
  # wwebjs:
  #   build:
  #     context: ./services/wwebjs
  #     dockerfile: Dockerfile
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     - API_KEY=${WWEBJS_API_KEY:-changeme}
  #     - WEBHOOK_URL=${VITE_SUPABASE_URL}/functions/v1/wa-webhook
  #   volumes:
  #     - wwebjs_sessions:/app/.wwebjs_auth
  #   restart: unless-stopped
  #   networks:
  #     - mantra-net

volumes:
  evolution_data:
  # wwebjs_sessions:

networks:
  mantra-net:
    driver: bridge
